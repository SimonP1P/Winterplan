<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Winterplan Simon &amp; Liz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine Karte pro Tag. Links das Datum, rechts oben zwei Orts-Spuren (Simon, Liz),
   darunter die Tagesleiste von 0 bis 24 Uhr mit allen Terminen als Balken, dann die Terminliste.
   Termine sind die Hauptsache: Wer, Titel, Von, Bis, Wo, Notiz. */
:root{
  --bg:#F1F5F6;--surface:#FFFFFF;--surface2:#E7EDF0;--ink:#12212C;--ink2:#506470;--line:#D3DCE1;
  --accent:#1B5C89;--accent-ink:#FFFFFF;
  --c0:#2C7A58;--c1:#BE3A5B;--c2:#AE7217;--c3:#2A6CAD;--c4:#7955B2;--c5:#5A6975;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1721;--surface:#14222E;--surface2:#1B2D3B;--ink:#E5EDF1;--ink2:#9AAEBA;--line:#27384A;
    --accent:#6DB2E3;--accent-ink:#0D1721;
    --c0:#5CC298;--c1:#F07F9D;--c2:#E2AE49;--c3:#6CADE6;--c4:#B198E4;--c5:#93A4B0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1721;--surface:#14222E;--surface2:#1B2D3B;--ink:#E5EDF1;--ink2:#9AAEBA;--line:#27384A;
  --accent:#6DB2E3;--accent-ink:#0D1721;
  --c0:#5CC298;--c1:#F07F9D;--c2:#E2AE49;--c3:#6CADE6;--c4:#B198E4;--c5:#93A4B0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:22px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto}
.c0{--pc:var(--c0)}.c1{--pc:var(--c1)}.c2{--pc:var(--c2)}.c3{--pc:var(--c3)}.c4{--pc:var(--c4)}.c5{--pc:var(--c5)}

/* Kopf */
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
h1{margin:0 0 10px;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,48px);line-height:1.04;letter-spacing:-.015em;text-wrap:balance}
.stats{margin:0 0 16px;color:var(--ink2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.stats .sep{margin:0 8px;opacity:.5}
.strip{display:grid;gap:3px}
.seg{border:0;background:none;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:stretch;min-width:0;border-radius:4px}
.seg .b{height:14px;border-radius:3px;background:var(--pc)}
.seg .b.full{height:30px}
.seg .sd{font-size:10px;line-height:1.2;text-align:center;color:var(--ink2);font-variant-numeric:tabular-nums}
.seg:hover .sd{color:var(--ink)}
.legend{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink2)}
.legend .hint{flex-basis:100%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:6px}
.sync{margin:12px 0 0;font-size:12px;color:var(--ink2)}
.sync.warn{padding:9px 12px;border-radius:8px;background:var(--surface2);border-left:4px solid var(--c2);color:var(--ink);font-size:13px;font-weight:600}
.bk{margin-top:32px;border-top:1px solid var(--line);padding-top:14px;color:var(--ink2);font-size:13px}
.bk summary{cursor:pointer;font-weight:600;color:var(--ink)}
.bk p{margin:10px 0}
.bk textarea{margin-top:10px;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

/* Ansichten */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 8px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.callout{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:10px;padding:12px 14px;margin:10px 0 6px}
.callout p{margin:0;flex:1 1 280px;min-width:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.sm{padding:5px 12px;font-size:13px}
.x{background:none;border:0;padding:2px 0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:12px;cursor:pointer}
.x:hover{color:var(--ink)}
.in,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.in{width:100%}
.meta{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
.f select,.f input{font-weight:400;color:var(--ink);font-size:15px}
.tsel{display:flex;align-items:center;gap:4px;font-weight:400;color:var(--ink)}
.tsel select{padding:8px 6px;font-variant-numeric:tabular-nums}
.addf{display:flex;flex-wrap:wrap;gap:8px}
.addf .in{flex:1 1 200px;width:auto}

/* Zeitleiste */
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px 14px;padding:16px 0;border-top:1px solid var(--line);scroll-margin-top:12px}
.dd{display:flex;flex-direction:column;gap:1px;min-width:0}
.dow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.dnum{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.1;font-variant-numeric:tabular-nums}
.tag{font-size:12px;color:var(--accent);font-weight:600;line-height:1.25}
.day.today .dnum{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--accent)}
.dc{min-width:0;display:flex;flex-direction:column;gap:10px}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.lane{--pc:var(--c5);min-width:0;display:flex;flex-direction:column;gap:1px;padding:8px 11px;border-radius:10px;
  background:var(--surface);background:color-mix(in srgb,var(--pc) 14%,var(--surface));
  border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--pc) 34%,var(--line))}
.lane.both{grid-column:1/-1}
.lane .who{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.lane .place{font-weight:700;color:var(--pc);color:color-mix(in srgb,var(--pc) 72%,var(--ink));overflow-wrap:anywhere}
.lane .from{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}

/* Tagesleiste */
.tl{position:relative;height:46px;border-radius:8px;overflow:hidden;background-color:var(--surface2);
  background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
.blk{position:absolute;display:block;border-radius:5px;border:1px solid var(--bg);padding:0 6px;font-size:12px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent-ink)}
.blk.s{top:2px;height:20px;line-height:18px;background:var(--accent)}
.blk.l{top:24px;height:20px;line-height:18px;background:var(--c4)}
.blk.b{top:2px;height:42px;line-height:40px;background:var(--ink2)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums;padding:0 1px;margin-top:3px}
.wd{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;flex:none}
.wd.s{background:var(--accent)}.wd.l{background:var(--c4)}.wd.b{background:var(--ink2)}

/* Terminliste */
.evs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ev{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;font-size:15px;min-width:0}
.ev .tm{flex:0 0 118px;font-weight:700;font-variant-numeric:tabular-nums}
.ev .et{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.ev .lc{color:var(--ink2)}
.ev .nt{display:block;font-size:12.5px;color:var(--ink2);padding-left:16px}
.its{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.it{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;min-width:0}
.it label{display:flex;align-items:flex-start;gap:8px;min-width:0;flex:1 1 120px}
.it input[type=checkbox],.leg input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;margin:1px 0 0;flex:none}
.it .done{text-decoration:line-through;color:var(--ink2)}
.idea{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.travel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.edit{background:none;border:0;color:var(--accent);font-weight:600;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Bearbeiten */
.editor{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
.ecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.eh{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.2}
.sub{margin:6px 0 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sub .meta{text-transform:none;letter-spacing:0;font-weight:500}
.evx{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.evx.add{border-color:var(--accent)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.trio{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.trio .f{flex:0 0 auto}
.trio .f.wer{flex:1 1 110px}
.trio .f.wer select{width:100%}
.edg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.ecol .addf .in{flex:1 1 150px}
textarea.in{min-height:120px;resize:vertical;line-height:1.45}
select:disabled{opacity:.45}
.dnote{margin:0;padding:8px 11px;background:var(--surface2);border-radius:8px;font-size:13.5px;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
@media (min-width:860px){
  .editor{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .ecol + .ecol{border-left:1px solid var(--line);padding-left:22px}
}

@media (min-width:760px){
  .day{grid-template-columns:96px minmax(0,1fr)}
}

/* Fahrten */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lead{margin:8px 0 6px;color:var(--ink2)}
.legs{list-style:none;margin:0;padding:0}
.leg{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.leg .when{flex:0 0 78px;font-weight:700;font-variant-numeric:tabular-nums}
.leg .route{flex:1 1 230px;min-width:0;overflow-wrap:anywhere}
.leg .route b{margin-right:6px}
.leg .note{flex:1 1 200px;width:auto}
.leg .bk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}

/* Checkliste und Orte */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;margin-top:10px}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:6px 0 10px}
.lst{list-style:none;margin:0 0 12px;padding:0}
.lst .it{padding:9px 0;border-top:1px solid var(--line)}
.prow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow .in{flex:1 1 200px;width:auto}
.sws{display:flex;gap:6px}
.sw{width:24px;height:24px;border-radius:50%;background:var(--pc);border:0;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.empty{color:var(--ink2);padding:14px 0}

.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toast span{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast span:empty{display:none}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">17. Dezember 2026 bis 2. Januar 2027</p>
    <h1>Winterplan Simon &amp; Liz</h1>
    <p class="stats" id="stats"></p>
    <div class="strip" id="strip" role="group" aria-label="Alle Tage im Überblick"></div>
    <p class="legend" id="legend"></p>
    <p class="sync" id="sync" aria-live="polite"></p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Ansicht">
    <button type="button" role="tab" data-act="tab" data-tab="zeit">Zeitleiste</button>
    <button type="button" role="tab" data-act="tab" data-tab="reisen">Fahrten</button>
    <button type="button" role="tab" data-act="tab" data-tab="todo">Checkliste</button>
    <button type="button" role="tab" data-act="tab" data-tab="orte">Orte</button>
  </nav>
  <div id="note"></div>
  <main id="view" role="tabpanel"></main>
  <details class="bk" id="bk">
    <summary>Datensicherung</summary>
    <p>Mit „Sicherung erzeugen“ steht der ganze Plan als Text im Feld. Den Text kopieren und aufbewahren. Zum Zurückholen den Text ins Feld einfügen und „Wiederherstellen“ drücken.</p>
    <div class="acts">
      <button type="button" class="btn sm" data-act="bkexport">Sicherung erzeugen</button>
      <button type="button" class="btn sm" data-act="bkimport">Wiederherstellen</button>
    </div>
    <textarea class="in" id="bkt" aria-label="Sicherungstext" placeholder="Hier steht oder erscheint der Sicherungstext"></textarea>
  </details>
</div>
<datalist id="locs"></datalist>
<div class="toast" aria-live="polite"><span id="toast"></span></div>

  function trips(m) {
    var list = m.legs.filter(function (l) { return S.fil === "alle" || l.who === S.fil; });
    var booked = m.legs.filter(function (l) { return (S.kv["leg_" + l.key] || {}).booked; }).length;
    var chips = [["alle", "Alle"], ["simon", "Simon"], ["liz", "Liz"]].map(function (c) {
      return '<button type="button" data-act="filter" data-who="' + c[0] + '" aria-pressed="' + (S.fil === c[0]) + '">' + c[1] + "</button>";
    }).join("");
    var rows = list.map(function (l) {
      var det = S.kv["leg_" + l.key] || {}, f = m.P(l.from), t = m.P(l.to);
      return '<li class="leg"><span class="when">' + short(l.date) + "</span>" +
        '<span class="route"><b>' + (l.who === "simon" ? "Simon" : "Liz") + '</b><i class="dot c' + f.c + '"></i>' + esc(f.name) + ' → <i class="dot c' + t.c + '"></i>' + esc(t.name) + "</span>" +
        '<select data-act="mode" data-key="' + l.key + '" aria-label="Verkehrsmittel">' + MODES.map(function (x) {
          return '<option value="' + x + '"' + ((det.mode || "") === x ? " selected" : "") + ">" + (x || "Verkehrsmittel offen") + "</option>";
        }).join("") + "</select>" +
        '<input class="in note" type="text" data-act="lnote" data-key="' + l.key + '" value="' + esc(det.note || "") + '" placeholder="Zeit, Strecke, Buchungsnummer" aria-label="Notiz zur Fahrt">' +
        '<label class="bk"><input type="checkbox" data-act="booked" data-key="' + l.key + '"' + (det.booked ? " checked" : "") + "> gebucht</label></li>";
    }).join("");
    return '<p class="lead">Die Fahrten ergeben sich aus den Ortswechseln in der Zeitleiste. <b>' + m.legs.length + "</b> insgesamt, <b>" + booked + "</b> gebucht.</p>" +
      '<div class="chips">' + chips + "</div>" + (rows ? '<ul class="legs">' + rows + "</ul>" : '<p class="empty">Keine Fahrten für diese Auswahl.</p>');
  }
  function listBlock(m, kind, title, ph) {
    var its = m.items.filter(function (i) { return i.kind === kind; });
    its.sort(function (a, b) { return (a.done - b.done) || String(a.date || "9").localeCompare(String(b.date || "9")); });
    var rows = its.map(function (i) {
      return '<li class="it"><label><input type="checkbox" data-act="done" data-id="' + esc(i.id) + '"' + (i.done ? " checked" : "") + '><span class="' + (i.done ? "done" : "") + '">' + esc(i.text) + "</span></label>" +
        '<span class="meta">' + esc(i.who) + (i.date ? " · " + short(i.date) : "") + '</span><button type="button" class="x" data-act="delitem" data-id="' + esc(i.id) + '">Entfernen</button></li>';
    }).join("");
    return "<section><h2>" + title + '</h2><ul class="lst">' + (rows || '<li class="empty">Noch nichts drin.</li>') + "</ul>" +
      '<form class="addf" data-act="additem"><input type="hidden" name="kind" value="' + kind + '">' +
      '<input class="in" type="text" name="text" placeholder="' + ph + '" aria-label="' + ph + '">' +
      '<select name="who" aria-label="Wer">' + WHO + '</select><select name="date" aria-label="Datum"><option value="">ohne Datum</option>' + dayOpts("") + "</select>" +
      '<button class="btn" type="submit">Hinzufügen</button></form></section>';
  }
  function todos(m) {
    return '<div class="cols">' + listBlock(m, "todo", "To-dos", "Neues To-do") + listBlock(m, "idee", "Ideen und Unternehmungen", "Neue Idee") + "</div>";
  }
  function placesView(m) {
    var use = {};
    m.days.forEach(function (d) { use[d.sp] = (use[d.sp] || 0) + 1; use[d.lp] = (use[d.lp] || 0) + 1; });
    var rows = m.places.map(function (p) {
      var sws = [0, 1, 2, 3, 4, 5].map(function (c) {
        return '<button type="button" class="sw c' + c + '" data-act="pcolor" data-id="' + esc(p.id) + '" data-c="' + c + '" aria-pressed="' + (p.c === c) + '" aria-label="Farbe ' + (c + 1) + '"></button>';
      }).join("");
      return '<div class="prow"><div class="sws">' + sws + '</div><input class="in" type="text" data-act="pname" data-id="' + esc(p.id) + '" value="' + esc(p.name) + '" aria-label="Name des Ortes">' +
        '<span class="meta">' + (use[p.id] || 0) + ' Tage belegt</span><button type="button" class="x" data-act="delplace" data-id="' + esc(p.id) + '">Entfernen</button></div>';
    }).join("");
    return '<p class="lead">Hier benennst du Orte um, zum Beispiel „Urlaub (Ort offen)“ in euer Ziel, und legst neue an.</p>' + rows +
      '<form class="addf" data-act="addplace" style="margin-top:14px"><input class="in" type="text" name="name" placeholder="Neuer Ort" aria-label="Neuer Ort"><button class="btn" type="submit">Ort anlegen</button></form>';
  }
  function noteHtml() {
    if (ack) return "";
    return '<div class="callout"><p>Ich habe den Plan in Termine zerlegt und die Orte abgeleitet: Istrup, Liz zu Hause, Urlaub mit noch offenem Ziel. Als Ort zählt, wo ihr am Abend seid. Uhrzeiten und Wo-Angaben fehlen noch und lassen sich bei jedem Tag mit „+ Termin“ oder „Bearbeiten“ ergänzen.</p>' +
      '<button type="button" class="btn" data-act="ack">Verstanden</button></div>';
  }

  function render(force) {
    if (!force && isEditing()) { S.dirty = true; return; }
    S.dirty = false;
    var m = model();
    $("stats").innerHTML = statsHtml(m);
    var st = $("strip"); st.style.gridTemplateColumns = "repeat(" + m.days.length + ",minmax(0,1fr))"; st.innerHTML = stripHtml(m);
    $("legend").innerHTML = legendHtml(m);
    var sy = $("sync"), loc = S.ready && S.mode === "local";
    sy.className = "sync" + (loc ? " warn" : "");
    sy.textContent = !S.ready ? "Verbinde …" : loc
      ? (S.lsOk === false
        ? "Achtung: Dieser Browser erlaubt kein Speichern. Eingaben gehen beim Neuladen verloren. Unten unter „Datensicherung“ kannst du sie als Text sichern."
        : "Achtung: Nur in diesem Browser gespeichert, nicht gemeinsam. Ein anderes Gerät oder ein Neuladen der Vorschau zeigt sie nicht. Unten unter „Datensicherung“ kannst du sie sichern.")
      : "Gemeinsam gespeichert. Änderungen sehen beide.";
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === S.tab));
    });
    var locs = {};
    m.places.forEach(function (p) { locs[p.name] = 1; });
    m.events.forEach(function (e) { if (e.loc) locs[e.loc] = 1; });
    $("locs").innerHTML = Object.keys(locs).map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join("");
    $("note").innerHTML = S.tab === "zeit" ? noteHtml() : "";
    $("view").innerHTML = S.tab === "zeit" ? timeline(m) : S.tab === "reisen" ? trips(m) : S.tab === "todo" ? todos(m) : placesView(m);
  }

  /* ---------- Eingaben ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var a = t.dataset.act;
    if (a === "tab") { S.tab = t.dataset.tab; render(true); }
    else if (a === "toggle") { S.open[t.dataset.date] = !S.open[t.dataset.date]; render(true); }
    else if (a === "jump") {
      S.tab = "zeit"; render(true);
      var el = $("d-" + t.dataset.date);
      if (el) el.scrollIntoView({ block: "start", behavior: reduce ? "auto" : "smooth" });
    }
    else if (a === "filter") { S.fil = t.dataset.who; render(true); }
    else if (a === "delitem") { put("item_" + t.dataset.id, { _del: true }); }
    else if (a === "delev") { put("ev_" + t.dataset.id, { _del: true }); }
    else if (a === "pcolor") { put("place_" + t.dataset.id, { c: +t.dataset.c }); }
    else if (a === "delplace") {
      var m = model(), n = 0;
      m.days.forEach(function (d) { if (d.sp === t.dataset.id) n++; if (d.lp === t.dataset.id) n++; });
      if (n > 0) say("Dieser Ort wird noch an " + n + " Tagen genutzt. Erst dort einen anderen wählen.");
      else put("place_" + t.dataset.id, { _del: true });
    }
    else if (a === "bkexport") {
      var bt = $("bkt"); bt.value = JSON.stringify(S.kv); bt.focus(); bt.select();
      say("Sicherung erzeugt. Text kopieren und aufbewahren.");
    }
    else if (a === "bkimport") {
      var data;
      try { data = JSON.parse($("bkt").value); } catch (er) { say("Das ist keine gültige Sicherung."); return; }
      if (!data || typeof data !== "object" || Array.isArray(data)) { say("Das ist keine gültige Sicherung."); return; }
      var keys = Object.keys(data).filter(function (k) {
        return /^[A-Za-z0-9_.~:@+-]{1,200}$/.test(k) && k !== "__proto__" && data[k] && typeof data[k] === "object" && !Array.isArray(data[k]);
      }).slice(0, 3000);
      keys.forEach(function (k) { put(k, data[k]); });
      say(keys.length + " Einträge wiederhergestellt.");
    }
    else if (a === "ack") { ack = true; try { localStorage.setItem("wp_ack2", "1"); } catch (er) {} render(true); }
  });
  document.addEventListener("change", function (e) {
    var tf = e.target.form;
    if (tf && tf.dataset.act === "addev" && (e.target.name === "sh" || e.target.name === "eh")) {
      var g = function (n) { return tf.querySelector('[name="' + n + '"]'); };
      var hasS = !!g("sh").value;
      g("sm").disabled = !hasS; g("eh").disabled = !hasS;
      if (!hasS) g("eh").value = "";
      g("em").disabled = !(hasS && g("eh").value);
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target, a = t.dataset && t.dataset.act;
    if (!a) return;
    var dt = t.dataset.date, id = t.dataset.id, key = t.dataset.key, o = {};
    if (a === "sp" || a === "lp") { o[a] = t.value; put("day_" + dt, o); }
    else if (a === "evt") put("ev_" + id, { text: t.value.trim() || "Termin" }, { defer: true });
    else if (a === "evl") put("ev_" + id, { loc: t.value.trim() }, { defer: true });
    else if (a === "evn") put("ev_" + id, { note: t.value.trim() }, { defer: true });
    else if (a === "dnote") put("day_" + dt, { dn: t.value.replace(/^\s+|\s+$/g, "") }, { defer: true });
    else if (a === "evw") put("ev_" + id, { who: t.value });
    else if (a === "evs" || a === "eve") {
      var box = t.closest(".tsel");
      var h = box.querySelector('[data-part="h"]').value, mm = box.querySelector('[data-part="m"]').value;
      o[a === "evs" ? "start" : "end"] = h === "" ? "" : h + ":" + (mm || "00");
      if (a === "evs" && h === "") o.end = "";
      put("ev_" + id, o);
    }
    else if (a === "done") put("item_" + id, { done: t.checked });
    else if (a === "mode") put("leg_" + key, { mode: t.value });
    else if (a === "lnote") put("leg_" + key, { note: t.value }, { defer: true });
    else if (a === "booked") put("leg_" + key, { booked: t.checked });
    else if (a === "pname") put("place_" + id, { name: t.value.trim() || "Ort" }, { defer: true });
  });
  document.addEventListener("submit", function (e) {
    var f = e.target, a = f.dataset && f.dataset.act;
    if (!a) return;
    e.preventDefault();
    var fd = new FormData(f);
    if (a === "additem") {
      var text = String(fd.get("text") || "").trim();
      if (!text) return;
      var id = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      put("item_" + id, { kind: fd.get("kind") || "todo", text: text, who: fd.get("who") || "Beide", date: fd.get("date") || "", done: false, ts: Date.now() });
    } else if (a === "addev") {
      var title = String(fd.get("text") || "").trim();
      if (!title) { say("Bitte einen Titel für den Termin eintragen."); return; }
      var tm = function (p) { var h = fd.get(p + "h"), mi = fd.get(p + "m"); return h ? h + ":" + (mi || "00") : ""; };
      var start = tm("s"), end = start ? tm("e") : "";
      S.lastWho = fd.get("who") || "Beide";
      put("ev_v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), {
        date: fd.get("date"), start: start, end: end, text: title, who: S.lastWho,
        loc: String(fd.get("loc") || "").trim(), note: String(fd.get("note") || "").trim(), ts: Date.now()
      });
    } else if (a === "addplace") {
      var name = String(fd.get("name") || "").trim();
      if (!name) return;
      var m = model();
      put("place_p" + Date.now().toString(36), { name: name, c: (m.places.length + 1) % 6 });
    }
  });
  document.addEventListener("focusout", function () {
    setTimeout(function () { if (S.dirty && !isEditing()) render(true); }, 80);
  });

  render(true);
  connect();
})();
</script>
</body></html>
